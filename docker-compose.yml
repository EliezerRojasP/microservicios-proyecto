services:
  eureka-service:
    image: eureka-service
    build:
      context: ./eureka-service
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - spring-network

  config-service:
    image: config-service
    build:
      context: ./config-service
      dockerfile: Dockerfile
    environment:
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/app/config-data
    volumes:
      - ./config-data:/app/config-data  # Mapea la carpeta local al contenedor
    ports:
      - "8081:8081"
    networks:
      - spring-network

  gateway-service:
    image: gateway-service
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # Cambiado para que coincida con el puerto original del servicio gateway
    depends_on:
      - eureka-service
      - config-service
    networks:
      - spring-network

  carro-service:
    image: carro-service
    build:
      context: ./carro-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"  # Cambiado para coincidir con el puerto original
    depends_on:
      - eureka-service
    networks:
      - spring-network

  moto-service:
    image: moto-service
    build:
      context: ./moto-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"  # Cambiado para coincidir con el puerto original
    depends_on:
      - eureka-service
    networks:
      - spring-network

  usuario-service:
    image: usuario-service
    build:
      context: ./usuario-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"  # Cambiado para coincidir con el puerto original
    depends_on:
      - eureka-service
    networks:
      - spring-network

  auth-service:
    image: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"  # Puerto para el servicio auth-service
    depends_on:
      - eureka-service
    networks:
      - spring-network

networks:
  spring-network:
    driver: bridge
